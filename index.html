<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium/Cesium.js"></script>
  <link href="cesium/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
    }
    #feedContainer {
      position: absolute;
      top: 60px; right: 0;
      width: 300px;
      height: calc(100% - 60px);
      background: white;
      overflow-y: auto;
      padding: 10px;
      border-left: 2px solid #f57c00;
      z-index: 10;
    }
    #formContainer h3 {
      margin-top: 0;
      color: #f57c00;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #f57c00;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #e65100;
    }
    #errorMsg {
      color: red;
      display: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>
  <div id="feedContainer">
    <h3>Message Feed</h3>
    <div id="messageFeed"></div>
  </div>

  <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      imageryProvider: new Cesium.UrlTemplateImageryProvider({
          url: 'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png'
      }),
      terrainProvider: new Cesium.EllipsoidTerrainProvider(),
      baseLayerPicker: false
    });

    let userLat = null;
    let userLon = null;
    const pins = [];
    const messageFeed = document.getElementById("messageFeed");

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const banned = ["badword1", "badword2", "racist", "offensive", "sex", "drugs"];
      const check = `${name} ${years} ${message}`.toLowerCase();
      const invalid = banned.some(w => check.includes(w));

      if (!userLat || !userLon || !name || !years || !message || invalid) {
        errorMsg.textContent = invalid ? "⚠️ Inappropriate content." : "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.style.display = "none";

      // Add a small random offset to avoid overlap
      const randomOffset = () => (Math.random() - 0.5) * 0.02;
      const adjustedLat = userLat + randomOffset();
      const adjustedLon = userLon + randomOffset();

      const pin = viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(adjustedLon, adjustedLat),
        billboard: {
          image: "Images/tigerpaw.png",
          scale: 0.8,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM
        },
        description: `<strong>${name}</strong><br><em>${years}</em><br>${message}`
      });

      pins.push(pin);

      const messageElement = document.createElement("div");
      messageElement.innerHTML = `<strong>${name} (${years}):</strong> ${message}`;
      messageFeed.prepend(messageElement);

      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }

    viewer.selectedEntityChanged.addEventListener(function(entity) {
      if (Cesium.defined(entity)) {
        viewer.selectedEntity = entity;
      }
    });
  </script>
</body>
</html>
