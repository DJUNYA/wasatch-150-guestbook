<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium/Cesium.js"></script>
  <link href="cesium/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: url('WasatchShieldshape.png') no-repeat center center;
      background-size: contain;
      padding: 60px 30px;
      max-width: 300px;
      font-family: sans-serif;
      color: #333;
      border-radius: 0;
      backdrop-filter: blur(2px);
      transform: scale(0.4);
      opacity: 0.65;
      transform-origin: top left;
      transition: all 0.4s ease;
    }
    #formContainer:hover {
      transform: scale(1);
      opacity: 1;
      z-index: 20;
    }
    #formContainer h3 {
      margin-top: 0;
      color: #f57c00;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #f57c00;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #e65100;
    }
    #errorMsg {
      color: red;
      display: none;
      margin-top: 8px;
    }
    #feedContainer {
      position: absolute;
      top: 60px; right: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.65);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
      overflow-y: auto;
      height: 90%;
    }
    #feedContainer h3 {
      color: #f57c00;
      margin-top: 0;
    }
    #feedList {
      list-style-type: none;
      padding: 0;
    }
    #feedList li {
      background-color: #f3f3f3;
      padding: 8px;
      margin-bottom: 10px;
      border-radius: 4px;
    }
    #feedList li strong {
      color: #f57c00;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>

  <div id="feedContainer">
    <h3>Guestbook Messages</h3>
    <ul id="feedList"></ul>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA6vOy4m1M6IupAKTSAy4Z0QHd7JpSN1nM",
      authDomain: "wasatch-150-guestbook.firebaseapp.com",
      databaseURL: "https://wasatch-150-guestbook-default-rtdb.firebaseio.com",
      projectId: "wasatch-150-guestbook",
      storageBucket: "wasatch-150-guestbook.appspot.com",
      messagingSenderId: "192403964274",
      appId: "1:192403964274:web:daf759134d950edda35deb",
      measurementId: "G-XYS5EHZ92L"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
  </script>

  <script>
    const viewer = new Cesium.Viewer('cesiumContainer');
    let userLat = null;
    let userLon = null;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    function saveMessage(name, years, message, lat, lon) {
      const newMessageRef = database.ref('messages').push();
      newMessageRef.set({
        name: name,
        years: years,
        message: message,
        lat: lat,
        lon: lon,
        timestamp: Date.now()
      });
    }

    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      const banned = ["badword1", "badword2", "racist", "offensive", "sex", "drugs"];
      const check = `${name} ${years} ${message}`.toLowerCase();
      const invalid = banned.some(w => check.includes(w));

      if (!userLat || !userLon || !name || !years || !message || invalid) {
        errorMsg.textContent = invalid ? "⚠️ Inappropriate content." : "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.style.display = "none";

      saveMessage(name, years, message, userLat, userLon);

      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }

    // Live update from Firebase
    database.ref('messages').on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) return;

      viewer.entities.removeAll();
      const feedList = document.getElementById("feedList");
      feedList.innerHTML = '';

      Object.values(data).forEach(entry => {
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(entry.lon, entry.lat),
          billboard: {
            image: "Images/tigerpaw.png",
            scale: 0.1,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM
          },
          label: {
            text: entry.name,
            font: "14pt sans-serif",
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.TOP,
            pixelOffset: new Cesium.Cartesian2(0, -40)
          },
          description: `<strong>${entry.name}</strong><br><em>${entry.years}</em><br>${entry.message}`
        });

        const messageElement = document.createElement("li");
        messageElement.innerHTML = `<strong>${entry.name}</strong> (${entry.years}):<br>${entry.message}`;
        feedList.prepend(messageElement);
      });
    });
  </script>
</body>
</html>
