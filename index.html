<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium/Cesium.js"></script>
  <link href="cesium/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
    }
    #formContainer h3 {
      margin-top: 0;
      color: #f57c00;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #f57c00;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #e65100;
    }
    #errorMsg {
      color: red;
      display: none;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>

  <script>
    const viewer = new Cesium.Viewer('cesiumContainer', {
      clustering: true
    });

    let userLat = null;
    let userLon = null;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    // Data Source for clustering
    const dataSource = new Cesium.CustomDataSource("guestbook");
    viewer.dataSources.add(dataSource);

    // Configure Clustering
    const clusterOptions = dataSource.clustering;
    clusterOptions.enabled = true;
    clusterOptions.pixelRange = 50; 
    clusterOptions.minimumClusterSize = 2;

    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!userLat || !userLon || !name || !years || !message) {
        errorMsg.textContent = "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }

      errorMsg.style.display = "none";

      // Random offset to avoid exact pin overlap
      const offsetLat = (Math.random() - 0.5) * 0.0005;
      const offsetLon = (Math.random() - 0.5) * 0.0005;

      const pinEntity = dataSource.entities.add({
        position: Cesium.Cartesian3.fromDegrees(userLon + offsetLon, userLat + offsetLat),
        billboard: {
          image: "Images/tigerpaw.png",
          scale: 0.5
        },
        label: {
          text: name,
          font: "12pt sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.TOP,
          pixelOffset: new Cesium.Cartesian2((Math.random() - 0.5) * 20, -40) // Randomize label position
        },
        description: `<strong>${name}</strong><br><em>${years}</em><br>${message}`
      });

      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }

    // Cluster Styling
    clusterOptions.clusterEvent.addEventListener((clusteredEntities, cluster) => {
      cluster.billboard.show = true;
      cluster.billboard.image = "Images/cluster.png";
      cluster.billboard.scale = 0.8;
      cluster.label.show = true;
      cluster.label.text = `${clusteredEntities.length}`;
      cluster.label.fillColor = Cesium.Color.WHITE;
      cluster.label.verticalOrigin = Cesium.VerticalOrigin.BOTTOM;
    });

    // Adjust Label Sizes on Zoom
    viewer.scene.preRender.addEventListener(() => {
      const zoomLevel = viewer.camera.positionCartographic.height;
      dataSource.entities.values.forEach(entity => {
        if (entity.label) {
          if (zoomLevel < 1000000) {
            entity.label.font = "14pt sans-serif"; // Larger font when zoomed in
          } else {
            entity.label.font = "10pt sans-serif"; // Smaller font when zoomed out
          }
        }
      });
    });

  </script>
</body>
</html>
