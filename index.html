<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium/Cesium.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js"></script>
  <link href="cesium/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
    }
    #feedContainer {
      position: absolute;
      bottom: 20px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
      max-height: 200px;
      overflow-y: auto;
    }
    #feedList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #feedList li {
      padding: 5px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>
  <div id="feedContainer">
    <h3>Guestbook Messages</h3>
    <ul id="feedList"></ul>
  </div>

  <script>
    // 🔥 Initialize Firebase
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 🌍 Cesium setup
    const viewer = new Cesium.Viewer('cesiumContainer');

    let userLat = null;
    let userLon = null;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!userLat || !userLon || !name || !years || !message) {
        errorMsg.textContent = "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }
      errorMsg.style.display = "none";

      const newEntry = {
        name,
        years,
        message,
        lat: userLat,
        lon: userLon,
        timestamp: Date.now()
      };

      // 🔥 Save message to Firebase
      db.ref("guestbook").push(newEntry);

      // Clear input fields
      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }

    // 🔄 Load existing messages from Firebase
    db.ref("guestbook").on("child_added", (snapshot) => {
      const data = snapshot.val();

      // 🗺️ Add pin to Cesium
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(data.lon, data.lat),
        billboard: {
          image: "Images/tigerpaw.png",
          scale: 0.3, // 🔹 Smaller pin size
          show: true
        },
        label: {
          text: data.name,
          font: "10pt sans-serif", // 🔹 Smaller font
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM, // 🔹 Adjust label position
          pixelOffset: new Cesium.Cartesian2(0, -25), // 🔹 Move text below the pin
          show: true
        },
        description: `<strong>${data.name}</strong><br><em>${data.years}</em><br>${data.message}`
      });

      // 📜 Add message to feed
      const feedList = document.getElementById("feedList");
      const li = document.createElement("li");
      li.innerHTML = `<strong>${data.name}</strong> (${data.years}): ${data.message}`;
      feedList.prepend(li); // Add newest at the top
    });

  </script>
</body>
</html>
