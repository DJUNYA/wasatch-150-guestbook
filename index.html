<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium.js"></script>
  <link href="cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body, #cesiumContainer {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
    }
    #formContainer h3 {
      margin-top: 0;
      color: #f57c00;
    }
    input, textarea, button {
      width: 100%;
      margin-top: 8px;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #f57c00;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover {
      background-color: #e65100;
    }
    #errorMsg {
      color: red;
      display: none;
      margin-top: 8px;
    }
    #feedContainer {
      position: absolute;
      top: 60px; right: 20px;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
      z-index: 10;
    }
    #feedContainer h3 {
      margin-top: 0;
      color: #f57c00;
    }
    #feedList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #feedList li {
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>
  <div id="feedContainer">
    <h3>Guestbook Messages</h3>
    <ul id="feedList"></ul>
  </div>

  <script>
    // Cesium setup
    const viewer = new Cesium.Viewer('cesiumContainer');

    let userLat = null;
    let userLon = null;

    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    // Feed section
    function addMessageToFeed(name, years, message) {
      const feedList = document.getElementById("feedList");
      const listItem = document.createElement("li");
      listItem.innerHTML = `<strong>${name}</strong> (${years} years): <em>${message}</em>`;
      feedList.appendChild(listItem);
    }

    // Drop pin and add message
    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!userLat || !userLon || !name || !years || !message) {
        errorMsg.textContent = "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }
      
      errorMsg.style.display = "none";

      // Small random offset to prevent exact overlap
      const offsetFactor = 0.0005; // Adjust for more/less separation
      let newLat = userLat + (Math.random() * 2 - 1) * offsetFactor;
      let newLon = userLon + (Math.random() * 2 - 1) * offsetFactor;

      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(newLon, newLat),
        billboard: {
          image: "Images/tigerpaw.png",
          scale: 0.3
        },
        label: {
          text: name,
          font: "14pt sans-serif",
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.TOP,
          pixelOffset: new Cesium.Cartesian2(0, -20)
        },
        description: `<strong>${name}</strong><br><em>${years}</em><br>${message}`
      });

      addMessageToFeed(name, years, message);

      // Clear input fields after submission
      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }
  </script>
</body>
</html>
