<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wasatch 150th Guestbook</title>
  <script src="cesium/Cesium/Cesium.js"></script>
  <link href="cesium/Cesium/Widgets/widgets.css" rel="stylesheet">
  <style>
    html, body {
      width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden;
    }
    #cesiumContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
    #header {
      position: absolute;
      top: 0; width: 100%;
      background: #f57c00;
      color: white;
      text-align: center;
      padding: 10px;
      z-index: 5;
      font-size: 1.5em;
      font-weight: bold;
      font-family: sans-serif;
    }
    #formContainer {
      position: absolute;
      top: 60px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
    }
    #feedContainer {
      position: absolute;
      bottom: 20px; left: 20px;
      z-index: 10;
      background: rgba(255,255,255,0.95);
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
      max-width: 300px;
      font-family: sans-serif;
      max-height: 200px;
      overflow-y: auto;
    }
    #feedList {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }
    #feedList li {
      padding: 5px;
      border-bottom: 1px solid #ddd;
    }
  </style>
</head>
<body>
  <div id="header">🎉 Happy 150th Anniversary, Wasatch Academy! 🎉</div>
  <div id="cesiumContainer"></div>
  <div id="formContainer">
    <h3>Sign the Guestbook</h3>
    <input id="name" placeholder="Your Name" />
    <input id="years" placeholder="Years at Wasatch" />
    <textarea id="message" placeholder="Your Message"></textarea>
    <button onclick="dropPin()">Submit</button>
    <p id="errorMsg"></p>
  </div>
  <div id="feedContainer">
    <h3>Guestbook Messages</h3>
    <ul id="feedList"></ul>
  </div>

  <script>
    // 🌍 Initialize Cesium Globe
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrainProvider: Cesium.createWorldTerrain()
    });

    let userLat = null;
    let userLon = null;

    // 🛰️ Fly to user's location
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userLat = pos.coords.latitude;
        userLon = pos.coords.longitude;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      },
      () => {
        userLat = 39.5444;
        userLon = -111.4566;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(userLon, userLat, 2000000.0)
        });
      }
    );

    function dropPin() {
      const name = document.getElementById("name").value.trim();
      const years = document.getElementById("years").value.trim();
      const message = document.getElementById("message").value.trim();
      const errorMsg = document.getElementById("errorMsg");

      if (!userLat || !userLon || !name || !years || !message) {
        errorMsg.textContent = "⚠️ Please complete all fields.";
        errorMsg.style.display = "block";
        return;
      }
      errorMsg.style.display = "none";

      const newEntry = {
        name,
        years,
        message,
        lat: userLat,
        lon: userLon,
        timestamp: Date.now()
      };

      // 🗺️ Add pin to Cesium
      viewer.entities.add({
        position: Cesium.Cartesian3.fromDegrees(newEntry.lon, newEntry.lat),
        billboard: {
          image: "Images/tigerpaw.png",
          scale: 0.2, // 🔹 Small pin
          show: true
        },
        label: {
          text: newEntry.name,
          font: "12pt sans-serif", 
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -20), 
          show: true
        },
        description: `<strong>${newEntry.name}</strong><br><em>${newEntry.years}</em><br>${newEntry.message}`
      });

      // 📜 Add message to feed
      const feedList = document.getElementById("feedList");
      const li = document.createElement("li");
      li.innerHTML = `<strong>${newEntry.name}</strong> (${newEntry.years}): ${newEntry.message}`;
      feedList.prepend(li);

      // 🔹 Save to localStorage
      saveMessage(newEntry);

      // Clear input fields
      document.getElementById("name").value = "";
      document.getElementById("years").value = "";
      document.getElementById("message").value = "";
    }

    function saveMessage(entry) {
      let messages = JSON.parse(localStorage.getItem("guestbookMessages")) || [];
      messages.push(entry);
      localStorage.setItem("guestbookMessages", JSON.stringify(messages));
    }

    function loadMessages() {
      let messages = JSON.parse(localStorage.getItem("guestbookMessages")) || [];
      messages.forEach(data => {
        // 🗺️ Load previous pins
        viewer.entities.add({
          position: Cesium.Cartesian3.fromDegrees(data.lon, data.lat),
          billboard: {
            image: "Images/tigerpaw.png",
            scale: 0.2,
            show: true
          },
          label: {
            text: data.name,
            font: "12pt sans-serif", 
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -20), 
            show: true
          },
          description: `<strong>${data.name}</strong><br><em>${data.years}</em><br>${data.message}`
        });

        // 📜 Load previous messages in the feed
        const feedList = document.getElementById("feedList");
        const li = document.createElement("li");
        li.innerHTML = `<strong>${data.name}</strong> (${data.years}): ${data.message}`;
        feedList.prepend(li);
      });
    }

    // 🔄 Load previous messages on page load
    window.onload = loadMessages;

  </script>
</body>
</html>
